<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1932px; height: 828px; position: relative; overflow: hidden;
    background: #FFF4DE;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  }
  .glow {
    position: absolute; right: -180px; top: -220px; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 190, 80, 0.45), rgba(255, 190, 80, 0) 70%);
  }
  .pin { position: absolute; left: 190px; top: 94px; width: 474px; height: 640px; }
  .text { position: absolute; left: 770px; top: 0; height: 828px; display: flex; flex-direction: column; justify-content: center; }
  h1 { margin: 0; font-size: 200px; line-height: 1.05; font-weight: 800; color: #161616; letter-spacing: -4px; }
  p { margin: 28px 0 0; font-size: 70px; line-height: 1.3; font-weight: 700; color: #5A4A3A; letter-spacing: -1px; }
  .bar { width: 120px; height: 14px; border-radius: 7px; background: #2E9E4F; margin-top: 44px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <svg class="pin" viewBox="100 40 400 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFD54A"/>
        <stop offset="0.45" stop-color="#FF9A2E"/>
        <stop offset="1" stop-color="#EF4B3A"/>
      </linearGradient>
    </defs>
    <g transform="translate(0 -8)">
      <path d="M300 546 C300 546 128 386 128 262 A172 172 0 0 1 472 262 C472 386 300 546 300 546 Z"
            fill="url(#fill)" stroke="#2E9E4F" stroke-width="24" stroke-linejoin="round"/>
      <g transform="translate(302 262) scale(1.35) translate(-302 -257)">
        <g stroke="#111111" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M241 176 V214 Q241 240 262 240 Q283 240 283 214 V176" stroke-width="9"/>
          <path d="M262 176 V240" stroke-width="9"/>
          <path d="M262 236 V338" stroke-width="14"/>
        </g>
        <ellipse cx="342" cy="208" rx="24" ry="34" fill="#111111"/>
        <path d="M342 236 V338" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
      </g>
    </g>
  </svg>
  <div class="text">
    <h1>밥동네</h1>
    <p>내 주변 식당을<br>가까운 순서대로</p>
    <div class="bar"></div>
  </div>
</body>
</html>
